name: Test @accesslint/mcp

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # The unit suite mocks `node:child_process`, so it proves the argv the MCP
  # builds and nothing about whether the binaries run. AccessLint/skills#8 was
  # a total failure of every audit tool on Windows that this suite could not
  # have caught; the integration project spawns the real CLI and Chrome, and
  # the Windows leg is the one that would have caught it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: npx turbo run build --filter=...@accesslint/mcp

      - run: bun run test
        working-directory: mcp

      - run: bun run test:integration
        working-directory: mcp
