name: Publish @accesslint/cli

on:
  push:
    tags: ["cli/v*"]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install

      - run: npx turbo run build --filter=...@accesslint/cli

      - name: Replace workspace:* with published versions
        working-directory: cli
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const sec of ['dependencies', 'devDependencies', 'peerDependencies']) {
            for (const [name, ver] of Object.entries(pkg[sec] ?? {})) {
              if (ver === 'workspace:*') {
                const dir = name.split('/')[1];
                const dep = JSON.parse(fs.readFileSync(path.join('..', dir, 'package.json'), 'utf8'));
                pkg[sec][name] = dep.version;
              }
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - run: npm publish --provenance --access public
        working-directory: cli

      # The release commit body explains why behavior moved; --generate-notes
      # alone lists PR titles and drops it. Prepend the body when there is one,
      # so the prose leads and the generated PR list still follows.
      - name: Create GitHub release
        run: |
          # $(...) strips the trailing newline %b emits, so a subject-only
          # commit tests as empty rather than as a one-byte file.
          NOTES="$(git log -1 --format=%b "$GITHUB_SHA")"
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          if [ -n "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "@accesslint/cli v${GITHUB_REF_NAME#cli/v}" \
              --notes-file /tmp/release-notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "@accesslint/cli v${GITHUB_REF_NAME#cli/v}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
