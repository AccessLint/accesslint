name: Publish @accesslint/core

on:
  push:
    tags: ["core/v*"]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install

      # Drive through turbo so the build dep runs first; bundle.test.ts
      # requires dist/ to exist before the test phase.
      - run: npx turbo run test --filter=@accesslint/core

      - run: npx turbo run build --filter=@accesslint/core

      - run: npm publish --provenance --access public
        working-directory: core

      # The release commit body explains why verdicts moved; --generate-notes
      # alone lists PR titles and drops it. Prepend the body when there is one,
      # so the prose leads and the generated PR list still follows.
      - name: Create GitHub release
        run: |
          # $(...) strips the trailing newline %b emits, so a subject-only
          # commit tests as empty rather than as a one-byte file.
          NOTES="$(git log -1 --format=%b "$GITHUB_SHA")"
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          if [ -n "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "@accesslint/core v${GITHUB_REF_NAME#core/v}" \
              --notes-file /tmp/release-notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "@accesslint/core v${GITHUB_REF_NAME#core/v}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps
        working-directory: core

      - name: Run ACT conformance gate
        run: npx turbo run act --filter=@accesslint/core

      - name: Upload EARL report
        uses: actions/upload-artifact@v4
        with:
          name: earl-report-browser
          path: core/act-fixtures/earl-report-browser.json

      - name: Notify a11y-agent
        if: ${{ env.A11Y_AGENT_DISPATCH_TOKEN != '' }}
        run: |
          gh api repos/AccessLint/a11y-agent/dispatches \
            -f event_type=core-published \
            -f 'client_payload[version]'="${GITHUB_REF_NAME#core/v}"
        env:
          GH_TOKEN: ${{ secrets.A11Y_AGENT_DISPATCH_TOKEN }}
          A11Y_AGENT_DISPATCH_TOKEN: ${{ secrets.A11Y_AGENT_DISPATCH_TOKEN }}

      - name: Notify accesslint-bench
        if: ${{ env.BENCH_DISPATCH_TOKEN != '' }}
        run: |
          gh api repos/AccessLint/accesslint-bench/dispatches \
            -f event_type=core-published \
            -f 'client_payload[version]'="${GITHUB_REF_NAME#core/v}"
        env:
          GH_TOKEN: ${{ secrets.BENCH_DISPATCH_TOKEN }}
          BENCH_DISPATCH_TOKEN: ${{ secrets.BENCH_DISPATCH_TOKEN }}

  deploy-earl:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: earl-report-browser

      - name: Commit and push EARL report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earl-report-browser.json
          git diff --cached --quiet && exit 0
          git commit -m "Update EARL report for ${GITHUB_REF_NAME}"
          git push
