name: Publish @accesslint/mcp

on:
  push:
    tags: ["mcp/v*"]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install

      - run: npx turbo run build --filter=...@accesslint/mcp

      - run: bun run test
        working-directory: mcp

      - name: Pin workspace deps and verify the dependency graph
        run: node scripts/prepare-publish.mjs mcp

      - run: npm publish --provenance --access public
        working-directory: mcp

      # The release commit body explains why behavior moved; --generate-notes
      # alone lists PR titles and drops it. Prepend the body when there is one,
      # so the prose leads and the generated PR list still follows.
      - name: Create GitHub release
        run: |
          # $(...) strips the trailing newline %b emits, so a subject-only
          # commit tests as empty rather than as a one-byte file.
          NOTES="$(git log -1 --format=%b "$GITHUB_SHA")"
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          if [ -n "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "@accesslint/mcp v${GITHUB_REF_NAME#mcp/v}" \
              --notes-file /tmp/release-notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "@accesslint/mcp v${GITHUB_REF_NAME#mcp/v}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
